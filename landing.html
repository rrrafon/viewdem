  <style>
    :root {
      --bg: #0b0e13; --fg: #e8ecf3; --muted: #9aa7bd;
      --card: #141a26; --card-border: #232c3d;
      --accent: #4da3ff; --accent-fg: #0b1220;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { padding: 32px 20px 8px; text-align: center; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 8px; }
    .sub { color: var(--muted); max-width: 640px; margin: 0 auto; }
    main {
      display: grid; gap: 16px; padding: 20px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      max-width: 1200px; margin: 0 auto;
    }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden;
      transition: transform .15s ease, border-color .15s ease;
    }
    a.card:hover, a.card:focus-visible {
      transform: translateY(-3px); border-color: var(--accent);
    }
    a.card img {
      display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
      background: #05070c;
    }
    .card-body { padding: 10px 14px 14px; }
    .card-body h2 { margin: 0; font-size: 1.05rem; }
    .card-body p { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>DEM Viewer — Philippine Volcanoes &amp; Lakes</h1>
    <p class="sub">Interactive 3D terrain for nine sites: Copernicus DEM elevation,
      Sentinel-2 imagery, OpenStreetMap buildings. Click a mountain to fly in.</p>
  </header>
  <main id="grid" aria-label="Datasets"></main>
  <script>
    (async () => {
      const DATASETS = [
        { id: 'mtmayon',     label: 'Mount Mayon',       desc: 'Perfect-cone stratovolcano, Albay' },
        { id: 'mtkanlaon',   label: 'Mount Kanlaon',     desc: 'Highest point in the Visayas' },
        { id: 'mtisarog',    label: 'Mount Isarog',      desc: 'Dormant stratovolcano, Camarines Sur' },
        { id: 'mtbuddajo',   label: 'Mount Bud Dajo',    desc: 'Cinder cone, Sulu Archipelago' },
        { id: 'mtpinatubo',  label: 'Mount Pinatubo',    desc: '1991 eruption reshaped Zambales' },
        { id: 'mttaal',      label: 'Mount Taal',        desc: 'Volcano island in a caldera lake' },
        { id: 'mtbanahaw',   label: 'Mount Banahaw',     desc: 'Dormant volcano, Quezon/Laguna' },
        { id: 'mthibokhibok',label: 'Mount Hibok-Hibok', desc: 'Active stratovolcano, Camiguin' },
        { id: 'lakebuhi',    label: 'Lake Buhi',         desc: 'Camarines Sur lake, Iriga volcano' },
      ];
      const grid = document.getElementById('grid');
      for (const d of DATASETS) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = './?m=manifest_' + d.id + '.json';
        a.setAttribute('aria-label', d.label + ' — open 3D terrain');
        const img = document.createElement('img');
        img.src = './thumbnails/' + d.id + '.png';
        img.alt = d.label + ' terrain preview';
        img.loading = 'lazy';
        const body = document.createElement('div');
        body.className = 'card-body';
        body.innerHTML = '<h2></h2><p></p>';
        body.querySelector('h2').textContent = d.label;
        body.querySelector('p').textContent = d.desc;
        a.append(img, body);
        grid.appendChild(a);
      }
    })();
  </script>
  <footer style="text-align:center; padding:16px; font-size:13px; color:#9aa7bd;">
    <a href="./privacy.html" style="color:#9aa7bd; text-decoration:none;">Privacy Policy</a>
  </footer>
</body>
</html>

  <style>
    :root {
      --bg: #0b0e13; --fg: #e8ecf3; --muted: #9aa7bd;
      --card: #141a26; --card-border: #232c3d;
      --accent: #4da3ff; --accent-fg: #0b1220;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { padding: 32px 20px 8px; text-align: center; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 8px; }
    .sub { color: var(--muted); max-width: 640px; margin: 0 auto; }
    main {
      display: grid; gap: 16px; padding: 20px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      max-width: 1200px; margin: 0 auto;
    }
    /* The card is a shell holding the link plus a separate notes button (a
       button may not legally sit inside an <a>, so the card is no longer
       the anchor itself). */
    .card {
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover, .card:focus-within { transform: translateY(-3px); border-color: var(--accent); }
    .card > a.card-link { display: block; text-decoration: none; color: inherit; }
    .card img {
      display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
      background: #05070c;
    }
    .card-body { padding: 10px 14px 14px; }
    .card-body h2 { margin: 0; font-size: 1.05rem; }
    .card-body p { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
    .card-foot { margin-top: auto; padding: 0 14px 14px; }
    .card-info {
      width: 100%; min-height: 38px; cursor: pointer;
      border: 1px solid var(--card-border); border-radius: 8px;
      background: transparent; color: var(--fg); font-size: .85rem;
    }
    .card-info:hover { border-color: var(--accent); color: var(--accent); }
    .card-info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card-thumb-missing {
      display: flex; align-items: center; justify-content: center;
      width: 100%; aspect-ratio: 1; font-size: 3rem; color: #33415c;
      background: linear-gradient(160deg, #18202f, #0c1220);
    }
    .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Philippine Volcanoes &amp; Lakes</h1>
    <p class="sub">Interactive 3D terrain for <span id="siteCount">…</span> sites. Click a mountain to fly in.</p>
  </header>
  <main id="grid" aria-label="Datasets"></main>
  <script type="module">
    import { loadSiteInfo, openSiteInfo } from './siteinfo.js?v=2';

    // Dataset names are not hard-coded here: the landing page is shared by
    // every site this project scaffolds, so it reads whatever the site
    // actually holds (data/datasets.json) and enriches it with the
    // hand-written notes (data/site_info.json).
    const pretty = (s) => String(s).replace(/^mt/i, 'Mount ').replace(/^lake/i, 'Lake ')
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/\b([a-z])/g, (c) => c.toUpperCase());

    const readJson = async (url) => {
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return { ok: true, data: await res.json() };
      } catch (e) {
        console.warn(`${url} unavailable:`, e.message);
        return { ok: false, data: null };
      }
    };

    (async () => {
      const grid = document.getElementById('grid');
      const [reg, notes] = await Promise.all([
        readJson('./data/datasets.json'),
        loadSiteInfo(),
      ]);

      // The registry is the source of truth for what the site holds. If it
      // is present, use it as-is — an empty registry means the site has no
      // datasets yet. Only when it is missing do we fall back to the ids
      // the notes mention.
      const registry = reg.ok && Array.isArray(reg.data) ? reg.data : null;
      // Registry/notes values become URLs: keep only plain filenames so a
      // crafted datasets.json cannot point at paths outside the site.
      const safeName = (v) => {
        const s = String(v == null ? '' : v).trim();
        return /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(s) ? s : null;
      };
      const datasets = (registry || Object.keys(notes).map((id) => ({ label: id })))
        .map((d) => ({
          id: safeName(d.label),
          file: safeName(d.file || `manifest_${d.label}.json`),
        }))
        .filter((d) => d.id && d.file);

      if (!datasets.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No datasets have been exported into this site yet.';
        grid.appendChild(p);
        return;
      }
      const count = document.getElementById('siteCount');
      if (count) count.textContent = String(datasets.length);

      for (const { id, file } of datasets) {
        const entry = notes[id] || {};
        const title = entry.name || pretty(id);
        const card = document.createElement('article');
        card.className = 'card';
        const a = document.createElement('a');
        a.className = 'card-link';
        a.href = './?m=' + encodeURIComponent(file);
        a.setAttribute('aria-label', title + ' — open 3D terrain');
        const img = document.createElement('img');
        img.src = './thumbnails/' + encodeURIComponent(id) + '.png';
        img.alt = title + ' terrain preview';
        img.loading = 'lazy';
        // No thumbnail for this dataset — show a neutral placeholder
        // instead of a broken image.
        img.addEventListener('error', () => {
          const ph = document.createElement('div');
          ph.className = 'card-thumb-missing';
          ph.textContent = '⛰';
          ph.setAttribute('aria-hidden', 'true');
          img.replaceWith(ph);
        });
        const body = document.createElement('div');
        body.className = 'card-body';
        body.innerHTML = '<h2></h2><p></p>';
        body.querySelector('h2').textContent = title;
        body.querySelector('p').textContent = entry.short || '';
        a.append(img, body);
        card.appendChild(a);
        // Notes button — only for datasets site_info.json knows about, so
        // an undocumented dataset simply shows no button.
        if (notes[id]) {
          const foot = document.createElement('div');
          foot.className = 'card-foot';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card-info';
          btn.setAttribute('data-site-info', id);
          btn.textContent = 'Read the notes';
          btn.setAttribute('aria-label', 'Read notes about ' + title);
          btn.onclick = () => openSiteInfo(id);
          foot.appendChild(btn);
          card.appendChild(foot);
        }
        grid.appendChild(card);
      }
    })();
  </script>
  <footer style="text-align:center; padding:16px; font-size:13px; color:#9aa7bd;">
    <a href="./privacy.html" style="color:#9aa7bd; text-decoration:none;">Privacy Policy</a>
  </footer>
</body>
